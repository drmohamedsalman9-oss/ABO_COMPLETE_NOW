name: Build Abo Kardoom APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/godot_templates"
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d "$RUNNER_TEMP/godot_templates"
          cp -a "$RUNNER_TEMP/godot_templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          ls -lh "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_release.apk"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project
        run: |
          mkdir -p build
          sed -i 's/gradle_build\/use_gradle_build=true/gradle_build\/use_gradle_build=false/' export_presets.cfg
          godot --headless --editor --path . --install-android-build-template
          godot --headless --editor --path . --import
          godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/ABO_KARDOOM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABO-KARDOOM-APK
          path: build/ABO_KARDOOM.apk
          if-no-files-found: error
